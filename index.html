<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--mut:#6b6a64;--card:#fff;--line:#d9d6cc;--acc:#0b6e5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--fg:#ecebe5;--mut:#9b9a92;--card:#22231f;--line:#3a3b35;--acc:#4cc2ad}}
:root[data-theme="dark"]{--bg:#171815;--fg:#ecebe5;--mut:#9b9a92;--card:#22231f;--line:#3a3b35;--acc:#4cc2ad}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
h1{font-size:20px;margin:0}header{padding:16px 20px 4px}header p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:minmax(260px,440px) 1fr;gap:16px;padding:12px 20px 24px;max-width:1150px;margin:auto}
@media(max-width:760px){main{grid-template-columns:1fr}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.tabs button,.chips button{border:1px solid var(--line);background:none;color:var(--fg);border-radius:99px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on,.chips button.sel{background:var(--acc);color:var(--bg);border-color:var(--acc)}
svg{width:100%;height:auto;max-height:76vh;background:var(--card);border:1px solid var(--line);border-radius:12px;display:block}
.c{stroke:var(--card);stroke-width:.8;cursor:pointer}.c:hover{filter:brightness(1.12)}.c.sel{stroke:var(--fg);stroke-width:1.8}
#p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
#p h2{margin:0 0 2px;font-size:24px}.cap{color:var(--mut);margin-bottom:10px}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 12px}dt{color:var(--mut);font-size:13px}dd{margin:0}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:14px 0 2px}p{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.grp{margin-top:14px;font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;gap:8px;margin-bottom:8px}#q{flex:1;min-width:0;padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font:inherit;font-size:14px}#cmp{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}#cmp.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{text-align:left;color:var(--mut);font-weight:600;padding:4px 6px;cursor:pointer;white-space:nowrap}.tbl td{padding:5px 6px;border-top:1px solid var(--line);position:relative}.tbl tr.r{cursor:pointer}.tbl tr.r:hover{background:var(--bg)}.tbl i{position:absolute;left:6px;bottom:2px;height:3px;background:var(--acc);opacity:.55;border-radius:2px}.note{color:var(--mut);font-size:12px;margin:2px 0 10px}
svg[data-v="ter"] .c:not(.t){opacity:.28}.t{stroke:var(--fg);stroke-width:.6}
</style></head><body>

4.1L270.2 153.7L271.9 149.9L272.6 145.3L274.4 142.9L276.7 141.0L278.2 137.7L282.1 136.7Z"},D={"COL":{"n":"Colombia","cap":"Bogotá (also largest city, ~2,600 m in the Andes). Other major cities: Medellín, Cali, Barranquilla, Cartagena","area":"~1.14 million km²","pop":"~52 million (2nd in South America)","lang":"Spanish, plus ~65 Indigenous and two Creole languages recognized regionally","cur":"Colombian peso (COP)","gov":"Presidential republic","ind":"Declared 1810, secured 1819 under Simón Bolívar (from Spain)","geo":"Only South American country with Pacific and Caribbean coasts. The Andes split into three ranges and hold most people; the Pacific coast is among the wettest places on Earth; Amazon in the southeast, Llanos in the east. Borders Venezuela, Brazil, Peru, Ecuador, Panama. Most bird species of any nation.","eco":"Oil, coal, coffee, flowers, gold. 2nd-largest coffee producer in Latin America (coffee region is UNESCO-listed). A 2016 FARC peace deal ended the main guerrilla war, but other armed groups still cause violence in some regions.","eth":"2018 census: ~87% no ethnic group (mostly mestizo and white), ~6.7% Afro-Colombian, ~4.3% Indigenous (Wayuu, Nasa, Zenú). San Basilio de Palenque is a UNESCO-recognized village founded by escaped slaves. Notable Lebanese/Syrian communities and a large Venezuelan migrant population.","cul":"Cumbia, vallenato, salsa (Cali); Shakira, J Balvin, Carlos Vives. Gabriel García Márquez (Nobel 1982). Arepas, bandeja paisa, ajiaco. Barranquilla Carnival (UNESCO), Medellín Flower Festival. Fernando Botero; Muisca gold at Bogotá. ~70%+ Catholic. Football and cycling.","pm":52,"ak":1142000},"VEN":{"n":"Venezuela","cap":"Caracas (other cities: Maracaibo, Valencia, Barquisimeto)","area":"~916,000 km²","pop":"~28 million (estimates vary; millions have emigrated)","lang":"Spanish; about 40 Indigenous languages such as Wayuunaiki, Warao and Pemón","cur":"Bolívar (VES)","gov":"Federal presidential republic (political situation in flux)","ind":"5 July 1811 (declared), secured at the Battle of Carabobo in 1821; part of Gran Colombia until 1830. Hugo Chávez governed from 1999 to 2013, followed by Nicolás Maduro; recent politics have been contested and fast-moving, so check current news.","geo":"A Caribbean coast with islands like Margarita and Los Roques, the Andes in the northwest (Pico Bolívar, 4,978 m), Lake Maracaibo, the Orinoco River and its delta, and the Llanos plains. In the southeast, the Guiana Highlands hold flat-topped tepuis and Angel Falls (979 m, the world’s tallest), in Canaima National Park (UNESCO).","eco":"Holds the largest proven oil reserves in the world, mostly heavy crude from the Orinoco Belt, and oil once supplied nearly all export income. GDP fell by about three-quarters between 2013 and 2020, with hyperinflation and sanctions, and the partial recovery since has left poverty high. Roughly 7–8 million people have emigrated, mainly to Colombia, Peru, the US and Chile.","eth":"Mostly mixed ancestry. The 2011 census recorded ~52% moreno (brown), ~44% white, ~3% Black and ~2.7% identifying as Indigenous (Wayuu, Warao, Pemón, Yanomami). Afro-Venezuelan communities are strongest along the central coast (Barlovento). Immigration from Spain, Italy and Portugal after World War II, and from Colombia, Lebanon, Syria, Germany (Colonia Tovar) and China, helped shape the population.","cul":"Joropo is the national music, played on harp, cuatro and maracas in the Llanos; gaita zuliana is the sound of Maracaibo’s Christmas season, and Afro-Venezuelan drumming drives the San Juan festival. The Dancing Devils of Yare (UNESCO) mark Corpus Christi. El Sistema youth orchestras produced conductor Gustavo Dudamel, and Jesús Soto and Carlos Cruz-Diez led kinetic art. Writers include Andrés Bello and Rómulo Gallegos. Food: arepas, cachapas, pabellón criollo (national dish), hallacas at Christmas, tequeños, and prized cacao. Religion: about 70% Catholic, with a growing evangelical minority and the spirit cult of María Lionza. Baseball is the top sport (Miguel Cabrera, Ronald Acuña Jr.), and Venezuela is famous for beauty pageants. Simón Bolívar, El Libertador, was born in Caracas.","pm":28,"ak":916000},"GUY":{"n":"Guyana","cap":"Georgetown (largest city; other towns: Linden, New Amsterdam)","area":"~215,000 km²","pop":"~0.8 million","lang":"English (official; the only English-speaking country in South America); Guyanese Creole is the common language, and Hindi, Urdu and Indigenous languages such as Macushi and Wapishana are also spoken","cur":"Guyanese dollar (GYD)","gov":"Parliamentary republic","ind":"26 May 1966, from the UK (formerly British Guiana); a republic since 1970. Dutch, then British, plantations relied on enslaved Africans and later on indentured workers from India.","geo":"About 85% forested, with Kaieteur Falls on the Potaro River (one of the world’s largest single-drop waterfalls by volume), the Essequibo River and the Rupununi savanna. Culturally part of the Caribbean community (CARICOM). Venezuela claims the Essequibo region, about two-thirds of Guyana’s territory, and the dispute is before the International Court of Justice.","eco":"Offshore oil, discovered in 2015 in the Stabroek block, made it one of the world’s fastest-growing economies as output has risen rapidly. Gold, bauxite, rice, sugar and timber remain important. Sharing the new wealth and the border dispute with Venezuela are major issues.","eth":"Indo-Guyanese ~40% (descendants of indentured workers from India), Afro-Guyanese ~29%, mixed ~20%, Amerindian ~10% (Macushi, Wapishana, Arawak, Carib and others), with small Portuguese and Chinese communities. Politics has often split along Indo- and Afro-Guyanese lines.","cul":"A Caribbean culture in South America. Mashramani (Republic Day, 23 February), Phagwah (Holi), Diwali and Eid are national holidays. Food: pepperpot, curry and roti, cook-up rice and metemgee. Music: calypso, chutney and soca. Cricket is the national passion, and Guyanese players have long starred for the West Indies team. Religion: about 60% Christian, ~25% Hindu and ~7% Muslim. Writers include Wilson Harris and Pauline Melville.","pm":0.8,"ak":215000},"SUR":{"n":"Suriname","cap":"Paramaribo (home to about half the population; other towns: Lelydorp, Nieuw Nickerie)","area":"~163,000 km²","pop":"~0.6 million","lang":"Dutch (official; the only Dutch-speaking country in South America); Sranan Tongo is the common language, and Javanese, Sarnami Hindustani, Maroon languages and Indigenous languages are also spoken","cur":"Surinamese dollar (SRD)","gov":"Parliamentary republic","ind":"25 Nov 1975, from the Netherlands. A 1980 military coup and an interior war (1986–1992) shaped the late 20th century; democracy has been restored since.","geo":"The smallest independent country in South America, about 90% covered by rainforest. The Central Suriname Nature Reserve (UNESCO) protects about 1.6 million hectares, and the Suriname River feeds the large Brokopondo reservoir. The historic inner city of Paramaribo (UNESCO) mixes wooden Dutch colonial buildings with mosques, synagogues and temples.","eco":"Gold, oil and bauxite are the main exports, and large offshore oil discoveries are expected to lift output later this decade. High public debt and inflation have been major problems, and the country recently restructured its debt.","eth":"Remarkably diverse: Indo-Surinamese (Hindustani) ~27%, Maroons (descendants of escaped slaves, living largely in the interior) ~22%, Creoles ~16%, Javanese ~14%, mixed ~13%, and Indigenous peoples (Lokono, Kali’na, Trio, Wayana) ~4%. Smaller groups include Chinese, Lebanese and Brazilian communities. Indians and Javanese arrived as contract workers after slavery ended in 1863.","cul":"Hindus, Muslims, Christians and Jews live side by side, and in Paramaribo a mosque and a synagogue stand next to each other. Keti Koti (1 July) marks the end of slavery, and Holi (Phagwa), Diwali and Eid are widely celebrated. Food: pom (a Creole casserole), roti with chicken curry, bakabana, saoto soup and peanut sauces. Music: kaseko, kawina and baithak gana. Football and badminton are popular, and Cynthia McLeod is a leading novelist. Many Surinamese live in the Netherlands.","pm":0.6,"ak":163000},"GUF":{"n":"French Guiana","cap":"Cayenne (other towns: Kourou, Saint-Laurent-du-Maroni)","area":"~83,500 km²","pop":"~0.3 million","lang":"French (official); Guianese Creole, Maroon languages, Hmong and Indigenous languages (Kali’na, Wayãpi, Teko)","cur":"Euro (EUR)","gov":"Overseas department and region of France","ind":"Not independent; French since the 1600s and an overseas department since 1946, so part of the EU. Penal colonies, including Devil’s Island, operated until 1953.","geo":"About 96% rainforest, including the Amazonian Park of French Guiana, among the largest national parks in the EU. The Guiana Space Centre at Kourou launches Ariane and Vega rockets, and its position near the equator gives rockets extra lift.","eco":"Dominated by the space sector, plus gold mining (including illegal mining), fishing and French public spending. Unemployment is high and prices run well above those in mainland France. It uses the euro.","eth":"Highly diverse: Creoles (about a third), Maroons (Bushinengue), Amerindians (Kali’na, Wayana, Teko, Wayãpi), Hmong refugees from Laos who settled in the 1970s, Brazilians, Haitians, Surinamese, Chinese and metropolitan French. Many residents are recent migrants.","cul":"A blend of French, Creole, Maroon and Amazonian traditions. Carnival runs from January to Ash Wednesday, one of the longest in the region, with masked and costumed touloulous. Food: bouillon d’awara, blaff, colombo, accras and Hmong dishes from the Sunday market at Cacao. Hmong textiles and Maroon woodcarving are notable crafts. Religion: mostly Catholic, alongside Maroon, Hmong and Indigenous beliefs. Football is popular, and the territory has its own team in CONCACAF.","pm":0.3,"ak":83500},"BRA":{"n":"Brazil","cap":"Brasília (planned capital, inaugurated 1960; largest city: São Paulo; other major cities: Rio de Janeiro, Salvador, Belo Horizonte)","area":"~8.5 million km² (5th largest country in the world)","pop":"~203 million (2022 census), the largest in South America","lang":"Portuguese (official); about 270 Indigenous languages, plus German and Italian dialects in the south","cur":"Real (BRL)","gov":"Federal presidential republic","ind":"7 Sept 1822, from Portugal, as an empire under Pedro I. Slavery ended in 1888 (the last in the Americas), the republic began in 1889, and a military dictatorship ruled 1964–1985.","geo":"About 60% of the Amazon rainforest lies in Brazil. Other biomes include the Pantanal (the world’s largest tropical wetland), the Cerrado savanna, the Caatinga scrublands and the heavily cleared Atlantic Forest. Iguaçu Falls, about 7,400 km of Atlantic coast, and more species than any other country. Borders every South American country except Chile and Ecuador.","eco":"Largest economy in Latin America. Top exporter of soy, with iron ore, offshore oil, coffee (the world’s largest producer), beef, sugar and ethanol; Embraer is a major aircraft maker. Amazon deforestation and deep inequality are persistent issues.","eth":"2022 census: ~45% pardo (mixed), ~43% white, ~10% Black, ~0.8% Indigenous, ~0.4% Asian. Brazil has one of the largest African-descended populations outside Africa, centered on Salvador in Bahia. Indigenous people number about 1.7 million across 300+ peoples (Yanomami, Guarani, Tikuna), and some live in voluntary isolation. Immigrant waves built large Italian, German, Portuguese, Lebanese, Syrian and Polish communities, and São Paulo has the largest Japanese-descended community outside Japan.","cul":"A blend of Indigenous, African and Portuguese traditions. Music: samba, bossa nova, MPB, forró, funk carioca and sertanejo. Carnival in Rio, Salvador and Olinda; capoeira (UNESCO); Candomblé and Umbanda alongside Catholicism. Food: feijoada, pão de queijo, moqueca, açaí, churrasco, brigadeiro, caipirinha. Writers: Machado de Assis, Jorge Amado, Clarice Lispector. Religion: ~57% Catholic (the world’s largest Catholic population) and ~27% Protestant or evangelical, with a growing nonreligious share. Football is a national obsession, with five World Cup titles (1958, 1962, 1970, 1994, 2002) and stars from Pelé to Neymar; volleyball and Formula 1 (Ayrton Senna) also thrive.","pm":203,"ak":8515000},"ECU":{"n":"Ecuador","cap":"Quito (largest city: Guayaquil; other cities: Cuenca, Santo Domingo, Machala)","area":"~284,000 km²","pop":"~17 million (2022 census)","lang":"Spanish (official); Kichwa and Shuar are official languages of intercultural relations, and about a dozen other Indigenous languages are spoken","cur":"US dollar (adopted in 2000 after a banking crisis)","gov":"Presidential republic","ind":"24 May 1822 (Battle of Pichincha), then part of Gran Colombia until it became a separate republic in 1830. Political instability has been common, and since 2023 the country has faced a surge in gang and drug-trafficking violence.","geo":"Three mainland regions: the Andean highlands with Quito (about 2,850 m) and volcanoes such as Cotopaxi and Chimborazo, whose summit is the farthest point from Earth’s center; the Amazon (Oriente); and the Pacific coast. The Galápagos Islands (UNESCO) lie about 1,000 km offshore and helped inspire Darwin’s theory of evolution. Named for the equator, which crosses just north of Quito.","eco":"Oil is the main export, followed by bananas (the world’s top exporter), shrimp (also a top world exporter), cocoa, flowers and fish. Fighting between criminal groups has hurt security, tourism and investment since 2023, and the government has repeatedly declared states of emergency.","eth":"2022 census: ~78% mestizo, ~8% Montubio (coastal rural mestizos), ~8% Indigenous, ~5% Afro-Ecuadorian, ~2% white. Indigenous peoples include the Kichwa of the highlands (such as the Otavalo and Saraguro) and the Amazonian Shuar, Achuar, Waorani and Cofán. Afro-Ecuadorians live mainly in Esmeraldas and the Chota Valley. Many Ecuadorians have emigrated to the US and Spain, and Venezuelans and Colombians form the largest immigrant groups.","cul":"Rich Andean and Afro-Ecuadorian traditions. Music: pasillo (the national genre), San Juanito, and marimba from Esmeraldas. Otavalo’s market is famed for textiles, and Inti Raymi is celebrated in the highlands. Food: ceviche, encebollado, locro de papas, hornado and cuy (guinea pig) in the Andes. The so-called Panama hat is actually woven in Ecuador from toquilla straw (UNESCO). Quito’s historic center, the first UNESCO World Heritage listing, and Cuenca are major sites. Religion: mostly Catholic, with a growing evangelical Protestant population. Football is the favorite sport, and the national team has reached several World Cups, including 2022.","pm":17.0,"ak":284000},"PER":{"n":"Peru","cap":"Lima (home to about a third of Peruvians; other cities: Arequipa, Trujillo, Cusco, Chiclayo)","area":"~1.285 million km² (19th largest country in the world)","pop":"~34 million","lang":"Spanish (official); Quechua and Aymara are official where they predominate, and dozens of Amazonian languages such as Asháninka and Awájun are spoken","cur":"Sol (PEN)","gov":"Presidential republic","ind":"28 July 1821 (declared by José de San Martín), secured at the Battle of Ayacucho in December 1824. The Shining Path conflict (1980–2000) killed an estimated 69,000 people, most of them Quechua-speaking highlanders. Since 2018 several presidents have been removed or have resigned.","geo":"Three regions: a desert coast with Lima, the Andes (Huascarán, 6,768 m) and the Amazon, which covers about 60% of the territory. Machu Picchu and Cusco (the Inca capital), the Sacred Valley, the Nazca Lines, Colca Canyon, Lake Titicaca (shared with Bolivia) and Manu National Park in the rainforest. The cold Humboldt Current feeds one of the world’s richest fisheries.","eco":"A leading mining economy: the world’s second-largest copper producer, plus silver, gold and zinc. Also fishmeal (anchoveta) and booming agro-exports such as avocados, blueberries, grapes and coffee. The Chinese-built Chancay megaport opened in 2024. Roughly seven in ten jobs are informal.","eth":"2017 census (ages 12+, self-identification): ~60% mestizo, ~22% Quechua, ~6% white, ~4% Afro-Peruvian, ~2% Aymara, ~2% Amazonian peoples. The state recognizes 55 Indigenous peoples, including the Asháninka, Awájun and Shipibo. Afro-Peruvians are concentrated on the southern coast. Peru also has one of the largest Chinese-descended and Japanese-descended communities in Latin America, whose food shaped chifa and Nikkei cooking.","cul":"Inca heritage and living Quechua traditions, including Inti Raymi (24 June) and the Qoyllur Rit’i pilgrimage (UNESCO). Music: huayno, marinera, Afro-Peruvian cajón rhythms and chicha cumbia. Food: ceviche (UNESCO-recognized), lomo saltado, ají de gallina, causa, anticuchos and pisco sour, plus thousands of potato varieties from the crop’s birthplace. Writers: César Vallejo, José María Arguedas and Mario Vargas Llosa (Nobel 2010). Religion: ~76% Catholic and ~14% evangelical (2017 census), often mixed with Andean beliefs such as Pachamama. Football and volleyball are the main sports, and Chicama has one of the world’s longest surfable waves.","pm":34,"ak":1285000},"BOL":{"n":"Bolivia","cap":"Sucre (constitutional capital); La Paz is the seat of government and, at about 3,650 m, the world’s highest. Largest city: Santa Cruz de la Sierra","area":"~1.10 million km²","pop":"~12 million","lang":"Spanish plus 36 official Indigenous languages (Quechua, Aymara and Guaraní are the most spoken)","cur":"Boliviano (BOB)","gov":"Presidential republic (plurinational state)","ind":"6 Aug 1825, from Spain, and named for Simón Bolívar. Bolivia lost its coastline to Chile in the War of the Pacific (1879–1884) and the Chaco region to Paraguay in the 1930s. Evo Morales became the first Indigenous president in 2006, and the 2009 constitution made Bolivia a plurinational state.","geo":"Landlocked and very high. The Altiplano holds Lake Titicaca (shared with Peru) and the Salar de Uyuni, the world’s largest salt flat. The Andes include Illimani and Sajama (6,542 m, the highest peak), while the lowlands hold Amazon rainforest and the Chaco, linked to the highlands by the Yungas valleys. One of the world’s most biodiverse countries.","eco":"Natural gas, zinc, silver, tin, gold and soy are major exports, and Bolivia holds some of the world’s largest lithium resources, mostly undeveloped. Coca is grown legally for traditional use. The economy has been strained by falling gas output and shortages of fuel and dollars.","eth":"One of the most Indigenous countries in the Americas: roughly 40% identify as Indigenous in recent censuses (mostly Quechua and Aymara, with Guaraní, Chiquitano and dozens of Amazonian peoples), and mestizos are another large group. Afro-Bolivians live mainly in the Yungas and have a ceremonial king. Smaller communities include Mennonites, Japanese-descended and Middle Eastern families, and migrants from Peru and Brazil.","cul":"Andean culture runs strong: the Oruro Carnival (UNESCO) and the Gran Poder festival in La Paz, diablada dance, Andean music on zampoña and charango, and Aymara and Quechua weaving, with Pachamama honored each August. Tiwanaku and Samaipata are UNESCO sites, and Sucre and Potosí have colonial centers. Food: salteñas, silpancho, api with pasteles, chuño, quinoa and coca tea. Cholitas, Aymara and Quechua women in bowler hats and layered skirts, are cultural icons, including in cholita wrestling. Religion: mostly Catholic, with a growing evangelical minority and Andean beliefs blended in. Football is the favorite sport.","pm":12.0,"ak":1098000},"PRY":{"n":"Paraguay","cap":"Asunción (other cities: Ciudad del Este, San Lorenzo, Luque)","area":"~407,000 km²","pop":"~6.8 million","lang":"Spanish and Guaraní (both official); most Paraguayans speak Guaraní, and many mix the two in Jopara","cur":"Guaraní (PYG)","gov":"Presidential republic","ind":"14 May 1811, from Spain, followed by decades of isolation under José Gaspar Rodríguez de Francia. The War of the Triple Alliance (1864–1870) killed a huge share of the population, and Alfredo Stroessner ruled as dictator from 1954 to 1989.","geo":"Landlocked. The Paraguay River splits the green, fertile east, where most people live, from the dry Gran Chaco in the west, which covers about 60% of the land but holds few people. Paraguay shares the Itaipú dam with Brazil and the Yacyretá dam with Argentina.","eco":"Exports hydroelectric power from Itaipú and Yacyretá and is a major exporter of soy and beef, with corn and wheat also growing. The economy has grown quickly, but informal work and rural poverty remain widespread.","eth":"About 95% mestizo (Spanish and Guaraní ancestry), making it one of the most culturally blended countries in the region; ~2% identify as Indigenous, among 19 peoples such as the Guaraní, Enxet, Nivaclé and Aché. German-speaking Mennonite colonies farm the Chaco, and there are Japanese and Korean communities and Brazilian settlers in the east.","cul":"Guaraní heritage shapes everyday life: the language, the names, and the national drink tereré (cold yerba mate). Music: the Paraguayan harp, polka paraguaya and guarania. Augusto Roa Bastos (Cervantes Prize 1989) is the leading writer. Food: chipa, sopa paraguaya (a cornbread, not a soup), mbejú and asado. The Jesuit missions of La Santísima Trinidad de Paraná and Jesús de Tavaranguyé are UNESCO sites. Religion: overwhelmingly Catholic, with the Virgin of Caacupé honored on 8 December. Football is the favorite sport, and Paraguay reached the 2010 World Cup quarterfinals.","pm":6.8,"ak":407000},"CHL":{"n":"Chile","cap":"Santiago (the metro area holds over a third of Chileans; other cities: Valparaíso, Concepción, Antofagasta)","area":"~756,000 km² (plus a claimed Antarctic sector)","pop":"~18.5 million (2024 census)","lang":"Spanish (with distinctive local slang); Mapudungun, Aymara, Quechua and Rapa Nui","cur":"Chilean peso (CLP)","gov":"Presidential republic","ind":"12 Feb 1818 (declared), after the first national junta of 18 Sept 1810. Salvador Allende was elected in 1970, and a 1973 coup began Augusto Pinochet’s dictatorship, which ended in 1990 after the 1988 plebiscite. Voters rejected two constitutional rewrites, in 2022 and 2023.","geo":"About 4,300 km long and averaging under 200 km wide. The Atacama is the driest non-polar desert; the Andes include Ojos del Salado (6,893 m), the world’s highest volcano; Patagonian fjords and Torres del Paine lie in the south, and Easter Island (Rapa Nui, UNESCO) far out in the Pacific. Along the Ring of Fire, Chile had the 1960 Valdivia earthquake, the strongest ever recorded (magnitude 9.5).","eco":"World’s top copper producer and a leading lithium producer, plus salmon (second only to Norway), wine and fruit exports such as cherries and blueberries. An OECD member since 2010, with one of South America’s highest incomes but marked inequality, which fueled the 2019 protests.","eth":"2017 census: ~13% identified as Indigenous, mainly Mapuche (about four in five), plus Aymara, Diaguita, Lickanantay (Atacameño), Quechua, Rapa Nui, Kawésqar and Yagán. Most others are mestizo or of European descent (Spanish, Basque, German, Italian, British, Croatian). Chile has one of the largest Palestinian-descended communities outside the Middle East, and Afro-Chileans in Arica gained legal recognition in 2019. Recent migration from Venezuela, Peru, Haiti, Colombia and Bolivia has raised the foreign-born share to around 8%.","cul":"Nobel poets Gabriela Mistral (1945, the first Latin American to win the literature prize) and Pablo Neruda (1971), plus Isabel Allende and Roberto Bolaño; Nueva Canción singers Violeta Parra and Víctor Jara. The cueca is the national dance and rodeo (huaso culture) the official national sport. Food: empanadas de pino, pastel de choclo, cazuela, completos, curanto from Chiloé, seafood, and mote con huesillo. Wine (carménère is the signature grape) and pisco sour. Fiestas Patrias (18 September) is the biggest holiday. UNESCO sites include Chiloé’s wooden churches, Valparaíso and Rapa Nui. Religion: Catholics remain the largest group but are declining, as evangelicals and nonreligious people grow. Football is the favorite sport, with Copa América wins in 2015 and 2016.","pm":18.5,"ak":756000},"ARG":{"n":"Argentina","cap":"Buenos Aires (Greater Buenos Aires holds about a third of the population; other cities: Córdoba, Rosario, Mendoza)","area":"~2.78 million km² (8th largest country in the world)","pop":"~46 million (2022 census)","lang":"Spanish (Rioplatense, with voseo); Guaraní, Quechua, Mapudungun and other Indigenous languages; Welsh survives in Chubut, Patagonia","cur":"Argentine peso (ARS)","gov":"Federal presidential republic","ind":"9 July 1816 (Tucumán Congress), after the May Revolution of 1810 and the campaigns of José de San Martín. A military dictatorship (1976–1983) carried out forced disappearances, and Argentina lost the 1982 Falklands War; democracy has held since 1983.","geo":"Andes with Aconcagua (6,961 m), the highest peak in the Americas, the fertile Pampas, arid Patagonia, and Tierra del Fuego with Ushuaia, the world’s southernmost city. Iguazú Falls, Perito Moreno Glacier, Península Valdés whale-watching, and the colorful Quebrada de Humahuaca. Argentina claims the Falkland Islands (Malvinas).","eco":"A major farm exporter (soy products, corn, beef, wheat), with lithium in the north and the Vaca Muerta shale oil and gas field in Patagonia. Malbec from Mendoza leads a large wine industry. Recurring inflation, debt defaults and currency crises have long shaped the economy, and poverty remains high.","eth":"Mostly of European descent, with Italian and Spanish ancestry the largest, followed by German, French, Welsh, Polish and Ukrainian. About 3% self-identify as Indigenous in the 2022 census (Mapuche, Kolla, Guaraní, Qom), and under 1% as Afro-Argentine, a legacy of the colonial slave trade. Other communities include Syrian-Lebanese descendants, Latin America’s largest Jewish community (about 180,000), and recent immigrants from Paraguay, Bolivia, Venezuela and China.","cul":"Tango (UNESCO) was born in the ports of Buenos Aires and Montevideo (Carlos Gardel, Astor Piazzolla); also folklore (chacarera, zamba) and rock nacional. Food: asado, empanadas, milanesas, dulce de leche, alfajores, and mate shared everywhere. Writers: Jorge Luis Borges, Julio Cortázar and Ernesto Sábato; Buenos Aires has a famed theatre scene (Teatro Colón) and the Grand Splendid bookshop. Pope Francis (Jorge Bergoglio), the first Latin American pope, was from Buenos Aires. Religion: ~63% Catholic, ~15% Protestant or evangelical, ~19% nonreligious. Football (World Cup titles in 1978, 1986 and 2022; Maradona, Messi), rugby and polo are major sports.","pm":46.0,"ak":2780000},"URY":{"n":"Uruguay","cap":"Montevideo (about half the population lives in the metro area; other cities: Salto, Paysandú, Punta del Este)","area":"~176,000 km² (second-smallest in South America)","pop":"~3.4 million","lang":"Spanish (Rioplatense); Portuñol is spoken near the Brazilian border","cur":"Uruguayan peso (UYU)","gov":"Presidential republic","ind":"25 Aug 1825 (declared), recognized in 1828 as a buffer between Argentina and Brazil. A civil-military dictatorship ruled 1973–1985, and Uruguay is today among the strongest democracies in Latin America.","geo":"Rolling grasslands and low hills, with Atlantic beaches at Punta del Este, the Río de la Plata to the south and the Uruguay River to the west. Colonia del Sacramento (UNESCO) is a historic port town. There are more cattle than people.","eco":"A stable, high-income economy built on beef, soy, wood pulp, rice, dairy and wool, with about 95% of electricity from renewable sources. Uruguay legalized cannabis and same-sex marriage in 2013 and ranks high for democracy and low for corruption.","eth":"About 88% of European descent (mainly Spanish and Italian), ~5% Afro-Uruguayan (higher in some counts that include mixed ancestry), ~2% Indigenous. The Charrúa were nearly wiped out in the 1800s, but descendants today are reviving their identity. Jewish, Armenian, Lebanese and Basque communities are significant, and recent arrivals come from Venezuela, Cuba and Colombia.","cul":"Candombe drumming (UNESCO), born in Afro-Uruguayan communities, and murga theater groups define Carnival, the longest in the world at about 40 days. Tango (UNESCO) is shared with Buenos Aires, and Carlos Gardel is claimed by both. Mate is carried everywhere in a thermos. Food: asado, chivito sandwiches, dulce de leche and alfajores. Writers: Eduardo Galeano, Mario Benedetti, Juan Carlos Onetti and Horacio Quiroga. Religion: the most secular country in Latin America, with Catholics, Protestants and a large nonreligious share. Football is a passion: Uruguay hosted and won the first World Cup in 1930 and won again in 1950.","pm":3.4,"ak":176000},"BLZ":{"n":"Belize","cap":"Belmopan (largest city: Belize City; other towns: San Ignacio, Orange Walk)","area":"~22,970 km²","pop":"~0.4 million","lang":"English (official); Belize Kriol is the common language; Spanish, Garifuna, Maya languages and Plautdietsch (Mennonites) are also spoken","cur":"Belize dollar (BZD, pegged 2:1 to the US dollar)","gov":"Parliamentary constitutional monarchy","ind":"21 Sept 1981, from the UK (formerly British Honduras). Guatemala’s long-standing territorial claim is before the International Court of Justice.","geo":"The only Central American country with no Pacific coast, and the only one where English is official. Home to the Belize Barrier Reef (UNESCO), the second-largest in the world, and the Great Blue Hole sinkhole. Maya Mountains and rainforest cover much of the interior, with Maya sites such as Caracol, Lamanai and Xunantunich and the Cockscomb Basin jaguar preserve. Belmopan replaced Belize City as capital after Hurricane Hattie in 1961.","eco":"Tourism is the largest sector (reef diving, Maya sites, Ambergris Caye), alongside sugar, bananas, citrus, seafood and small-scale oil. Public debt has been a major challenge.","eth":"2010 census: ~53% Mestizo, ~26% Creole, ~11% Maya (Yucatec, Mopan, Q’eqchi’), ~6% Garifuna, ~4% East Indian, ~4% Mennonite. Creoles descend mostly from enslaved Africans and British settlers, Garifuna from Afro-Indigenous people exiled from St Vincent in the 1790s, and Mennonites arrived from the 1950s as farmers. Many Mestizos came from Mexico and Guatemala, including refugees from the 1980s wars, and there are also Chinese, Lebanese and recent Central American migrant communities.","cul":"Garifuna language, dance and drumming (UNESCO) and punta rock; Settlement Day on 19 November. Kriol and Maya traditions, including Maya cacao and chocolate-making. Food: rice and beans with stew chicken, fry jacks, hudut and tamales. The September Celebrations run from St George’s Caye Day (10 Sept) to Independence Day (21 Sept). Religion: mostly Christian, split among Catholics and a growing Protestant population, alongside Maya and Garifuna spiritual traditions. Football and basketball are popular.","pm":0.4,"ak":22970},"GTM":{"n":"Guatemala","cap":"Guatemala City (other cities: Mixco, Villa Nueva, Quetzaltenango)","area":"~108,900 km²","pop":"~18 million (most populous in Central America)","lang":"Spanish plus 22 Mayan languages (K’iche’, Q’eqchi’, Kaqchikel and Mam are the most spoken), Garifuna and Xinka","cur":"Quetzal (GTQ)","gov":"Presidential republic","ind":"15 Sept 1821, from Spain; briefly part of Mexico, then the Central American federation until 1839–1841. A 36-year civil war (1960–1996) ended with the 1996 peace accords.","geo":"Volcanic highlands with 37 volcanoes (Fuego, Pacaya and Santiaguito are active) and Tajumulco (4,220 m), the highest point in Central America. Lake Atitlán, Semuc Champey, the Petén rainforest with the Maya city of Tikal (UNESCO), and Pacific and short Caribbean coasts. Earthquakes and hurricanes are recurring hazards.","eco":"Largest economy in the region: coffee, bananas, sugar, cardamom (a top world producer), textiles and palm oil. Remittances now equal around a fifth of GDP. Poverty is widespread, and chronic child malnutrition is among the highest in the world, especially in Maya communities.","eth":"2018 census: ~42% Maya, ~56% Ladino (mixed or non-Indigenous), ~2% Xinka, under 1% Garifuna and Afro-descendant. Maya peoples such as the K’iche’, Q’eqchi’, Kaqchikel and Mam are concentrated in the western and northern highlands. The Garifuna live around Livingston on the Caribbean coast, and there are German-descended coffee families and a Lebanese community. A UN-backed truth commission found state forces responsible for most of the roughly 200,000 killed or disappeared in the civil war, the large majority of them Maya.","cul":"Maya traditions are central: village-specific woven dress (traje), the Popol Vuh, and Maya spiritual ceremonies that blend with Catholicism, including the folk saint Maximón. Food: pepián (national dish), kak’ik turkey soup, tamales, chuchitos, corn tortillas and coffee. Marimba is the national instrument. Antigua Guatemala (UNESCO) is known for Semana Santa processions and sawdust carpets; giant kites fly at Sumpango on 1 November, and Chichicastenango has a famed market. Nobel winners Miguel Ángel Asturias (literature, 1967) and Rigoberta Menchú (peace, 1992). Religion: split between Catholics and a large evangelical Protestant population. Football is the favorite sport.","pm":18,"ak":108900},"HND":{"n":"Honduras","cap":"Tegucigalpa (largest city: San Pedro Sula; other cities: Choloma, La Ceiba)","area":"~112,500 km²","pop":"~10 million","lang":"Spanish; Garifuna, Miskito, Tawahka, Pech, Chortí and Bay Islands English Creole","cur":"Lempira (HNL)","gov":"Presidential republic","ind":"15 Sept 1821, from Spain; left the Central American federation in 1838. A brief 1969 war with El Salvador, the Soccer War, followed World Cup qualifiers.","geo":"Mostly mountainous, with a long Caribbean coast, a short Pacific coast on the Gulf of Fonseca, the Bay Islands (Roatán, Utila) on the Mesoamerican Reef, and the La Mosquitia rainforest including the Río Plátano Biosphere Reserve (UNESCO). Hurricane Mitch (1998) and hurricanes Eta and Iota (2020) caused major damage.","eco":"One of the poorer economies in the hemisphere, with remittances near a quarter of GDP. Exports include coffee (the region’s top producer), bananas, palm oil, shrimp and apparel from assembly plants. Emigration to the US is high, driven by poverty and violence.","eth":"~90% mestizo, ~7% Indigenous, ~2% Afro-Honduran, ~1% white. Indigenous peoples include the Lenca (the largest group), Miskito, Chortí Maya, Tolupan, Pech and Tawahka. Garifuna communities live along the north coast, and English-speaking Afro-Caribbean Bay Islanders on Roatán and Utila. There is a prominent Palestinian- and Arab-descended community, especially around San Pedro Sula.","cul":"Maya heritage at Copán (UNESCO), famed for its hieroglyphic stairway. Garifuna language, dance and music (UNESCO) with punta rhythms; Garifuna Settlement Day on 19 November. Food: baleadas (the national street food), sopa de caracol (conch soup), plato típico and tamales. Lenca pottery and crafts. Religion: nearly split between Catholics and evangelical Protestants. Football is the national passion; the team qualified for the 1982, 2010 and 2014 World Cups.","pm":10,"ak":112500},"SLV":{"n":"El Salvador","cap":"San Salvador (other cities: Santa Ana, San Miguel, Soyapango)","area":"~21,040 km²","pop":"~6.3 million","lang":"Spanish (official); Nawat (Pipil) survives with only a handful of speakers","cur":"US dollar (since 2001)","gov":"Presidential republic","ind":"1821, from Spain (left the Central American federation in 1841)","geo":"Smallest and most densely populated country in Central America, and the only one with no Caribbean coast. Nicknamed Pulgarcito de América (Tom Thumb of the Americas) and the Land of Volcanoes, with about 20 volcanoes, a Pacific surf coast, and cooler highlands along the Honduran border. A civil war (1980–1992) ended with the Chapultepec Peace Accords.","eco":"Uses the US dollar; remittances equal roughly a quarter of GDP. Also textiles, coffee, sugar. Gang violence (MS-13, Barrio 18) fell sharply under a state of exception in force since 2022, which has drawn human-rights criticism.","eth":"~86% mestizo (mixed Spanish and Indigenous ancestry), ~13% white, and a very small share identifying as Indigenous (0.2% in the 2007 census) or Afro-descendant. Indigenous peoples include the Nahua-Pipil (Nawat speakers), Lenca and Kakawira (Cacaopera). Indigenous identity and language were suppressed after La Matanza, the 1932 military massacre that killed an estimated 10,000–40,000 mostly Indigenous and peasant people, so official counts are widely seen as an undercount; Indigenous peoples gained constitutional recognition in 2014. There is also a notable Palestinian and Arab-descended community with a strong presence in business and politics, and over 2 million people of Salvadoran origin live in the US.","cul":"Food: pupusas (thick corn or rice tortillas stuffed with cheese, beans or pork, served with curtido, a pickled cabbage slaw) are the national dish, with National Pupusa Day on the second Sunday of November; also tamales, yuca frita, atol de elote and horchata de morro. Heritage: Joya de Cerén (UNESCO), a Maya farming village preserved under volcanic ash, and Tazumal. Letters and art: Salarrué, Claudia Lars, Roque Dalton, Manlio Argueta, and Fernando Llort’s colorful folk art from La Palma. Music: cumbia salvadoreña, marimba, and the folk song Torito Pinto. Festivals: the August Fiestas Agostinas honoring the Divine Savior of the World, and the Bolas de Fuego fireball festival in Nejapa on August 31. Religion: mostly Christian, split between Catholics and a growing evangelical Protestant population; Archbishop Óscar Romero, killed in 1980 and canonized in 2018, is widely revered. Football is the favorite sport, and surfing is big along the La Libertad coast.","pm":6.3,"ak":21040},"NIC":{"n":"Nicaragua","cap":"Managua (other cities: León, Masaya, Granada, Estelí)","area":"~130,400 km²","pop":"~6.9 million","lang":"Spanish; Miskito, Mayangna, Rama, Garifuna and English Creole on the Caribbean coast","cur":"Córdoba (NIO)","gov":"Presidential republic; power is concentrated in the Ortega–Murillo government, and the UN and human-rights groups have documented repression of the opposition, press and Church","ind":"15 Sept 1821, from Spain; left the Central American federation in 1838. US occupation 1912–1933, the Somoza dynasty until the 1979 Sandinista revolution, and the Contra war in the 1980s.","geo":"Largest country in Central America by area. Lake Nicaragua is the region’s largest lake; volcanoes include Momotombo, Masaya (with a lava lake) and the twin peaks of Ometepe Island. The wet Caribbean Mosquito Coast has autonomous regions and the Bosawás rainforest reserve, Central America’s largest. Earthquakes struck Managua in 1931 and 1972.","eco":"One of the poorest economies in Latin America, with remittances around a quarter of GDP. Exports include gold, coffee, beef, sugar, peanuts and apparel from free-trade zones. Many Nicaraguans have emigrated since the 2018 unrest.","eth":"~69% mestizo, ~17% white, ~9% Black or Creole, ~5% Indigenous (estimates vary). Indigenous peoples include the Miskito, Mayangna and Rama on the Caribbean side and the Chorotega, Nahua and Matagalpa in the Pacific region. Creoles and Garifuna on the Caribbean coast (Bluefields) descend from enslaved Africans and Caribbean migrants. There are small German, Italian and Chinese communities, and hundreds of thousands of Nicaraguans live abroad, mainly in Costa Rica and the US.","cul":"Poetry runs deep: Rubén Darío (founder of modernismo), Ernesto Cardenal, Gioconda Belli and Sergio Ramírez. Colonial cities León (UNESCO, with the León Viejo ruins) and Granada. El Güegüense, a satirical colonial-era play, is UNESCO-recognized heritage; Palo de Mayo is the Caribbean coast’s May festival; La Gritería on 7 December honors the Virgin Mary. Food: gallo pinto, nacatamal, vigorón, quesillo. Religion: Catholic and evangelical Protestant. Baseball is the national sport, and boxers such as Alexis Argüello are national heroes.","pm":6.9,"ak":130400},"CRI":{"n":"Costa Rica","cap":"San José (other cities: Alajuela, Cartago, Heredia, Limón)","area":"~51,100 km²","pop":"~5.1 million (2022 census)","lang":"Spanish (official); Limón Creole English, and Indigenous languages such as Bribri, Cabécar and Maleku; English is widely spoken in tourism","cur":"Costa Rican colón (CRC); US dollars are widely accepted in tourist areas","gov":"Presidential republic","ind":"1821 from Spain; left the Central American federation in 1838. The army was abolished in 1948 after a brief civil war, and the country has been a stable democracy since.","geo":"Between Nicaragua and Panama, with Pacific and Caribbean coasts. Volcanoes (Arenal, Poás, Irazú) and the Talamanca range, topped by Chirripó (3,820 m); cloud forests at Monteverde, turtle nesting at Tortuguero, and Cocos Island and the Guanacaste conservation area (both UNESCO). About a quarter of the land is protected, the country holds roughly 5% of the world’s biodiversity, and it has over 900 bird species.","eco":"Ecotourism is a pillar, alongside medical devices (the top export), microchips, pineapples (world’s leading exporter), bananas and coffee. Nearly all electricity comes from renewables (hydro, geothermal, wind). Joined the OECD in 2021. Free universal healthcare and a literacy rate around 98%. Inequality and the cost of living remain concerns.","eth":"2011 census: ~84% white or mestizo, ~7% mulatto, ~2% Indigenous, ~1% Black or Afro-descendant, ~0.2% Chinese. Eight Indigenous peoples (Bribri, Cabécar, Ngäbe, Maleku, Boruca, Huetar, Chorotega, Teribe) live mostly in 24 Indigenous territories. Afro-Costa Ricans are concentrated in Limón province, many descended from Jamaican workers who came for the railroad and banana plantations in the late 1800s. There is also a long-established Chinese community. Nicaraguans are the largest immigrant group, an estimated 300,000 or more, with smaller communities of Venezuelans, Colombians and North American and European retirees. Costa Ricans call themselves Ticos.","cul":"Pura vida is the national greeting and philosophy. Food: gallo pinto (rice and beans, the national dish), casado plates, olla de carne, chifrijo, ceviche, tamales at Christmas, and strong local coffee. Music and dance: marimba and the punta guanacasteca (national dance) in Guanacaste, calypso in Limón. Heritage: painted oxcarts from Sárchi (UNESCO), Boruca masks and the Fiesta de los Diablitos, and a folklore of figures like La Llorona. Festivals: Independence Day (15 September) with its lantern parades, and the pilgrimage to Cartago for the Virgen de los Ángeles on 2 August. Religion: Catholicism is the state religion and the largest faith, with a large evangelical Protestant minority. The Nicoya Peninsula is one of the world’s Blue Zones for longevity. Football is the favorite sport (the national team reached the 2014 World Cup quarterfinals), and surfing is popular on both coasts. Nobel Peace Prize winner Óscar Arias (1987) was president.","pm":5.1,"ak":51100},"PAN":{"n":"Panama","cap":"Panama City (other cities: San Miguelito, Colón, David)","area":"~75,320 km²","pop":"~4.1–4.5 million depending on source (2023 census vs. UN estimates)","lang":"Spanish (official); English widely spoken, especially in Afro-Antillean communities and business; Ngäbere, Guna, Emberá and other Indigenous languages","cur":"Balboa (PAB) at par with the US dollar, which circulates as banknotes","gov":"Presidential republic","ind":"1821 from Spain (joined Gran Colombia); separated from Colombia in 1903 with US backing. The US-run Canal Zone ended and Panama took full control of the canal on 31 Dec 1999.","geo":"A narrow isthmus linking North and South America, with Caribbean and Pacific coasts. The Panama Canal (opened 1914, expanded 2016) is about 82 km long and joins the two oceans. Dense Darién Gap jungle borders Colombia; Volcán Barú (3,475 m) is the highest point; island chains include Guna Yala and Bocas del Toro. Over 1,000 bird species. A 1989 US invasion removed dictator Manuel Noriega.","eco":"Services dominate: Canal tolls and shipping, banking, and the Colón Free Zone, one of the world’s largest free-trade zones. Uses the US dollar. The Cobre Panamá copper mine was halted in late 2023 after the Supreme Court struck down its contract, and its future is disputed. A 2023–24 drought limited canal transits.","eth":"2010 census: ~65% mestizo, ~12% Indigenous, ~9% Afro-Panamanian, ~7% mulatto, ~7% white. Seven Indigenous peoples (Ngäbe, Buglé, Guna, Emberá, Wounaan, Naso, Bribri) hold self-governing comarcas, with Guna Yala the best known. Afro-Panamanians include Afro-colonial communities (Portobelo, Colón) descended from enslaved Africans, and English-speaking Afro-Antillean families descended from West Indian workers who built the railroad and canal. There are also sizable Chinese, Indian, Middle Eastern, Jewish and Greek communities, plus recent migrants from Venezuela, Colombia and Nicaragua.","cul":"Music and dance: tamborito (national dance), mejorana and típico accordion music, salsa (Rubén Blades), and reggae en español, which began here. The pollera is the ornate national dress, and Congo traditions live on in Portobelo and Colón. Food: sancocho (chicken soup, often called the national dish), arroz con pollo, ceviche, patacones, hojaldras, carimañolas. Heritage: Casco Viejo, Panamá Viejo ruins, and the Portobelo and San Lorenzo forts (all UNESCO). Festivals: Carnival (Las Tablas is famous) and Corpus Christi devil dances in Villa de Los Santos. Religion: mostly Catholic, with a growing Protestant population and small Jewish, Muslim, Hindu and Bahá’í communities. Baseball and boxing are the big sports (Mariano Rivera, Rod Carew, Roberto Durán); the men’s football team made its World Cup debut in 2018.","pm":4.3,"ak":75320},"MEX":{"n":"Mexico","cap":"Mexico City (largest city; other cities: Guadalajara, Monterrey, Puebla, Tijuana)","area":"~1.96 million km² (13th largest country in the world)","pop":"~130 million (2020 census: 126 million), the largest Spanish-speaking country","lang":"Spanish (de facto); 68 recognized Indigenous languages, including Nahuatl, Yucatec Maya, Mixtec and Zapotec","cur":"Mexican peso (MXN)","gov":"Federal presidential republic (31 states plus Mexico City)","ind":"16 Sept 1810 (Grito de Dolores), from Spain, recognized in 1821. Mexico lost about half its territory to the US in the 1846–1848 war, the 1910–1920 revolution shaped modern politics, and one party, the PRI, governed for most of the 20th century until 2000.","geo":"Bordered by the US to the north and Guatemala and Belize to the south, with Pacific and Gulf of Mexico coasts. The Sierra Madre ranges frame a central plateau with volcanoes such as Popocatépetl and Pico de Orizaba (5,636 m); deserts lie in the north and tropical forest in the south, including the Yucatán Peninsula with its cenotes. Mexico is one of the world’s most biodiverse countries and sits in an earthquake-prone zone.","eco":"The second-largest economy in Latin America, closely tied to the US through the USMCA trade pact. Exports include vehicles and auto parts, electronics, machinery and oil, with remittances and tourism also major. Mexico is the top silver producer and a leading exporter of avocados, tequila and beer. Drug-trafficking violence and inequality remain serious challenges.","eth":"Predominantly mestizo. In the 2020 census about 19% identified as Indigenous and about 2% as Afro-Mexican, and roughly 7 million people speak an Indigenous language. Large Indigenous groups include the Nahua, Maya, Zapotec and Mixtec; Afro-Mexican communities are strongest in Guerrero, Oaxaca and Veracruz. There are also Lebanese, Spanish, German, Chinese and Mennonite communities, and over 35 million people of Mexican origin live in the US.","cul":"Heritage from the Maya, Aztec (Mexica), Olmec and Zapotec, with sites such as Teotihuacan, Chichén Itzá and Palenque (UNESCO). Day of the Dead (UNESCO) is the best-known festival, alongside Independence Day on 16 September and Guadalupe celebrations on 12 December. Music: mariachi (UNESCO), norteño and banda. Art and letters: Diego Rivera, José Clemente Orozco, Frida Kahlo, Octavio Paz (Nobel 1990), Juan Rulfo, Carlos Fuentes and Sor Juana. Mexican cuisine is UNESCO-recognized: tacos, mole, tamales, pozole, tequila and mezcal. Religion: ~78% Catholic (2020 census), with devotion to the Virgin of Guadalupe and growing Protestant and nonreligious shares. Football is the favorite sport, with lucha libre and charrería also loved.","pm":130,"ak":1964000},"CUB":{"n":"Cuba","cap":"Havana (other cities: Santiago de Cuba, Camagüey, Holguín)","area":"~110,860 km² (the largest island in the Caribbean)","pop":"~10 million (estimates vary; falling because of emigration)","lang":"Spanish; Haitian Creole and Lucumí are also spoken","cur":"Cuban peso (CUP); foreign currency is used in many shops","gov":"Single-party socialist republic (Communist Party of Cuba)","ind":"20 May 1902, after independence wars in 1868 and 1895 (José Martí) and the 1898 Spanish–American War with US occupation. The 1959 revolution brought Fidel Castro to power, and a US embargo has been in place since the early 1960s.","geo":"The largest island of the Greater Antilles, with the Sierra Maestra in the east, the Escambray range, and wide fertile plains. Beaches such as Varadero, coral reefs, the limestone mogotes of the Viñales Valley, and the UNESCO-listed centers of Old Havana and Trinidad. Hurricanes are a regular threat.","eco":"A state-run socialist economy with a small but growing private sector. Tourism, nickel, tobacco and cigars, rum, sugar, and medical services and biotech are key earners. Since 2020 Cuba has faced severe shortages, blackouts, high inflation and heavy emigration, worsened by US sanctions and the pandemic.","eth":"Mostly of mixed ancestry. The 2012 census recorded ~64% white, ~27% mixed and ~9% Black, though many scholars say African ancestry is more widespread. The Indigenous Taíno were largely wiped out after the Spanish conquest. Communities include Spanish descendants (especially Galician and Canarian), Haitian and Jamaican descendants and Chinese Cubans, and there is a large Cuban diaspora in Florida.","cul":"Afro-Cuban and Spanish traditions blend in son, rumba, mambo, cha-cha-chá, salsa and trova (as in Buena Vista Social Club), in Santería (Lucumí) and in Santiago de Cuba’s Carnival. Writers: José Martí, Alejo Carpentier, Nicolás Guillén and Reinaldo Arenas; Hemingway lived near Havana. Food: ropa vieja, moros y cristianos, lechón asado, tostones, mojito and daiquiri. Cuban cigars are world-famous and 1950s American cars still fill the streets. Religion: Catholic roots, widespread Afro-Cuban religion, Protestants and a large nonreligious population. Baseball is the national sport, and boxing is a point of pride.","pm":10,"ak":110860},"DOM":{"n":"Dominican Republic","cap":"Santo Domingo (other cities: Santiago de los Caballeros, La Romana, Puerto Plata)","area":"~48,670 km² (the eastern two-thirds of Hispaniola)","pop":"~10.8 million (2022 census)","lang":"Spanish; Haitian Creole among migrants and English in some tourist areas","cur":"Dominican peso (DOP)","gov":"Presidential republic","ind":"27 Feb 1844, from Haiti, which had ruled the country from 1822; it returned briefly to Spanish rule in 1861–1865. The US occupied it in 1916–1924, and Rafael Trujillo ruled as dictator from 1930 to 1961.","geo":"Shares Hispaniola with Haiti. Pico Duarte (3,098 m) is the highest peak in the Caribbean, Lake Enriquillo is the Caribbean’s lowest point, Punta Cana and Samaná offer beaches and humpback whale watching, and Santo Domingo’s Colonial Zone, the oldest European settlement in the Americas, is a UNESCO site.","eco":"One of the Caribbean’s largest economies, driven by tourism, free-trade-zone manufacturing, gold and ferronickel mining, agriculture (cacao, bananas, coffee, tobacco and cigars) and remittances. It has grown strongly for decades, though inequality persists.","eth":"Mostly mixed: common estimates give ~70% mixed, ~16% Black and ~14% white. Taíno heritage survives in words and food. Haitian migrants and Dominicans of Haitian descent form a large, often marginalized community, and there are Spanish, Lebanese, Chinese and Venezuelan communities. Over 2 million Dominicans live abroad, mostly in the US.","cul":"Merengue and bachata (both UNESCO) are national music-and-dance traditions, and baseball is the passion, with stars like Sammy Sosa, David Ortiz and Juan Soto. Carnival is held in February. Food: la bandera dominicana (rice, beans and meat), sancocho, mangú and tostones, plus rum and cigars. Writers: Juan Bosch, and Dominican-American authors Julia Álvarez and Junot Díaz. Religion: mostly Catholic, with a growing Protestant share and devotion to Our Lady of Altagracia on 21 January.","pm":10.8,"ak":48670},"HTI":{"n":"Haiti","cap":"Port-au-Prince (other cities: Cap-Haïtien, Gonaïves, Les Cayes)","area":"~27,750 km² (the western third of Hispaniola)","pop":"~11.7 million","lang":"French and Haitian Creole (both official; nearly everyone speaks Creole)","cur":"Haitian gourde (HTG)","gov":"Republic in a prolonged political crisis, having gone years without national elections; transitional arrangements are in place, so check current news","ind":"1 Jan 1804, from France, after the Haitian Revolution led by Toussaint Louverture and Jean-Jacques Dessalines, the only successful slave revolt to found a state. It was the first independent Black republic and the second independent country in the Americas. France demanded a large indemnity from 1825, and the US occupied Haiti in 1915–1934.","geo":"Mountainous, with about three-quarters of the land in mountains and Pic la Selle (2,680 m) the highest point. The Citadelle Laferrière is a UNESCO site. Heavy deforestation worsens floods and landslides, and Haiti is hit by earthquakes (the 2010 quake killed well over 100,000 people) and hurricanes.","eco":"One of the poorest countries in the Americas: most people rely on subsistence farming or informal work, and remittances are about a fifth of GDP. Apparel assembly dominates exports. Gang control of much of Port-au-Prince since 2021 has displaced over a million people and disrupted food supply, trade and aid.","eth":"About 95% of Haitians are of African descent, with a small mixed-race elite and small Syrian-Lebanese communities. The Indigenous Taíno disappeared early in colonial times. Large Haitian diasporas live in the US (especially Miami and New York), the Dominican Republic, Canada and France.","cul":"Vodou, officially recognized as a religion in 2003, blends West African and Catholic traditions, and many Haitians practice both. Art: vivid painting, Croix-des-Bouquets metalwork, and Kompa and Rara music. Food: griot, diri ak djon djon (black mushroom rice), pikliz and soup joumou, eaten on 1 January (UNESCO). Writers: Jacques Roumain, Jacques Stephen Alexis, René Depestre and Edwidge Danticat. Carnival and football are widely loved.","pm":11.7,"ak":27750},"JAM":{"n":"Jamaica","cap":"Kingston (other cities: Montego Bay, Spanish Town, May Pen)","area":"~10,990 km²","pop":"~2.8 million","lang":"English (official); Jamaican Patois is widely spoken","cur":"Jamaican dollar (JMD)","gov":"Parliamentary constitutional monarchy (King Charles III is head of state)","ind":"6 Aug 1962, from the UK. Slavery ended in 1834, with full freedom in 1838. Jamaica remains a Commonwealth realm.","geo":"The third-largest island in the Greater Antilles, with the Blue Mountains (Blue Mountain Peak, 2,256 m), tropical rainforest, beaches at Negril and Montego Bay, Dunn’s River Falls and the Cockpit Country karst. Hurricanes are a major risk.","eco":"Tourism is the leading earner, alongside remittances, bauxite and alumina, agriculture (sugar, bananas, coffee including Blue Mountain) and business services. Public debt has fallen sharply since 2013, but crime and hurricane losses remain concerns.","eth":"~92% of Jamaicans are of African descent, ~6% mixed, with small communities of Indian (descended from indentured workers), Chinese, Syrian-Lebanese, European and Jewish origin. The Taíno were the earliest inhabitants, and the Maroon communities of the interior descend from escaped enslaved Africans and keep a degree of autonomy. Large diasporas live in the UK, US and Canada.","cul":"Reggae (UNESCO) was born in Kingston, with Bob Marley its global icon, alongside ska, rocksteady and dancehall; Rastafari has roots in the 1930s, and Patois shapes global slang. Food: jerk chicken and pork, ackee and saltfish (the national dish), curry goat, patties and rice and peas. Sports: sprinting dominates (Usain Bolt, Shelly-Ann Fraser-Pryce), and cricket and football are loved. Writers: Claude McKay, Louise Bennett-Coverley and Marlon James. Religion: mostly Christian, with a Rastafari minority.","pm":2.8,"ak":10990},"BHS":{"n":"The Bahamas","cap":"Nassau (on New Providence; other towns: Freeport, Marsh Harbour)","area":"~13,940 km² of land across about 700 islands and 2,400 cays","pop":"~0.4 million","lang":"English (official); Bahamian Creole","cur":"Bahamian dollar (BSD, pegged 1:1 to the US dollar)","gov":"Parliamentary constitutional monarchy (King Charles III is head of state)","ind":"10 July 1973, from the UK. Columbus’s first landfall in the Americas in 1492 is traditionally placed in the Bahamas.","geo":"Low-lying limestone islands scattered across the Atlantic east of Florida; the highest point, Mount Alvernia on Cat Island, is only about 63 m. Clear shallow water, pink-sand beaches, blue holes such as Dean’s Blue Hole, coral reefs, and the Exumas with their famous swimming pigs. Hurricanes, such as Dorian in 2019, can be devastating.","eco":"One of the wealthiest Caribbean economies per person. Tourism, including cruises, accounts for about half of GDP, alongside offshore financial services and fishing (spiny lobster). There is no personal income tax.","eth":"About 90% of Bahamians are Black, ~5% white and ~2% mixed (2010 census), descended largely from enslaved Africans and Loyalist settlers who arrived after the American Revolution. Haitian migrants form a large community, with smaller Greek, Chinese and Lebanese groups.","cul":"Junkanoo, a street parade of costumes, brass and goatskin drums on Boxing Day and New Year’s Day, is the signature festival, with rake-and-scrape music at local gatherings. Food: conch (fritters, salad, cracked), Bahamian macaroni and cheese, peas ’n’ rice, guava duff and Kalik beer. Religion: strongly Christian (Baptist, Anglican, Catholic and others). Track and field and sailing are popular, and the Bahamas has a strong Olympic tradition.","pm":0.4,"ak":13940},"TTO":{"n":"Trinidad and Tobago","cap":"Port of Spain (other cities: San Fernando, Chaguanas, Arima)","area":"~5,130 km² (two main islands)","pop":"~1.4 million","lang":"English (official); English-based Creole, plus Hindi, Spanish and French Creole remnants","cur":"Trinidad and Tobago dollar (TTD)","gov":"Parliamentary republic","ind":"31 Aug 1962, from the UK; a republic since 1976.","geo":"Two islands off Venezuela (Trinidad lies only about 11 km from the coast), with the Northern Range, the oil-rich south, the Caroni Swamp and the Pitch Lake, the world’s largest natural asphalt deposit. Tobago has coral reefs and the Main Ridge, one of the oldest legally protected forests in the Western Hemisphere. The islands lie south of the main hurricane belt.","eco":"A leading Caribbean energy economy built on natural gas, petrochemicals (ammonia and methanol) and oil, with tourism more important on Tobago. Declining gas output and crime are key challenges.","eth":"The most diverse in the Caribbean: roughly 35% Indo-Trinidadian (descended from indentured workers), ~34% Afro-Trinidadian and ~23% mixed, with small Chinese, Syrian-Lebanese, Portuguese and Venezuelan communities and Indigenous heritage in places like Arima.","cul":"Carnival is the national festival, and the steelpan was invented here in the 1930s and 1940s. Music: calypso, soca, chutney and parang. Diwali, Eid, Hosay, Phagwa and Emancipation Day are widely marked. Food: doubles, roti, callaloo, pelau and shark and bake. Cricket (Brian Lara) and track and field are popular, and V. S. Naipaul (Nobel 2001) was born in Trinidad. Religion: a mix of Christians, Hindus (~18%) and Muslims (~5%).","pm":1.4,"ak":5130},"PRI":{"n":"Puerto Rico","cap":"San Juan (other cities: Bayamón, Carolina, Ponce)","area":"~9,100 km²","pop":"~3.2 million","lang":"Spanish and English (both official; Spanish is the main language)","cur":"US dollar (USD)","gov":"Unincorporated territory of the United States (a commonwealth); residents are US citizens but cannot vote in presidential elections and have a non-voting delegate in Congress","ind":"Not independent: a Spanish colony from the 1490s until the US took it in 1898, and a commonwealth since 1952. Votes on status (statehood, independence or the current arrangement) have been non-binding and inconclusive.","geo":"A Greater Antilles island with the Cordillera Central, El Yunque (the only tropical rainforest in the US National Forest System), bioluminescent bays, and Old San Juan with its forts (UNESCO). Hurricane Maria in 2017 killed an estimated 3,000 people.","eco":"Pharmaceuticals and medical devices, tourism and services drive the economy, which carries heavy public debt and was put under a federal oversight board in 2016. Poverty is high and many residents have moved to the mainland; more Puerto Ricans live on the US mainland than on the island.","eth":"Mixed Taíno, Spanish and African ancestry; the 2020 census found most people identifying as two or more races or ‘some other race’, with ~17% white alone and ~7% Black alone. Dominicans are the largest immigrant group, and about 5.8 million people of Puerto Rican origin live on the US mainland.","cul":"Music: salsa, bomba, plena and reggaeton, which developed here, with artists like Bad Bunny and Ricky Martin. Food: mofongo, arroz con gandules, lechón asado, pasteles, tostones and coquito. Writers: Luis Palés Matos, Rosario Ferré and Esmeralda Santiago. Festivals: Three Kings Day (6 January) and the San Sebastián Street Festival in Old San Juan. Baseball (Roberto Clemente) and boxing are major sports. Religion: mostly Catholic, with a growing Protestant share.","pm":3.2,"ak":9100},"BRB":{"n":"Barbados","cap":"Bridgetown","area":"~430 km²","pop":"~0.28 million","lang":"English (official); Bajan Creole","cur":"Barbadian dollar (BBD, pegged 2:1 to the US dollar)","gov":"Parliamentary republic (the monarch was replaced by a president in 2021)","ind":"30 Nov 1966, from the UK; became a republic on 30 Nov 2021, though it remains in the Commonwealth.","geo":"The easternmost island of the Caribbean, mostly low coral limestone with hills in the Scotland District. The Atlantic east coast has rough surf, the west coast calm beaches, and Mount Hillaby (336 m) is the high point. Historic Bridgetown and its Garrison are a UNESCO site.","eco":"Tourism, offshore finance and business services, rum and light manufacturing support one of the highest incomes in the Caribbean, with strong health and education. The island is exposed to hurricanes and sea-level rise, and its Bridgetown Initiative has pushed for climate-finance reform.","eth":"About 92% Black (Afro-Barbadian), ~3% mixed and ~3% white, with small Indian and Chinese communities. Bajan culture grew out of the sugar-plantation era, and there are large Bajan diasporas in the UK, US and Canada.","cul":"Crop Over, the summer harvest festival ending in the Grand Kadooment parade; tuk music, calypso and soca. Food: cou-cou and flying fish (the national dish), pudding and souse, macaroni pie and local rum. Rihanna is the best-known Barbadian and cricket (Garfield Sobers) the national passion. Mostly Anglican and other Christian.","pm":0.28,"ak":430},"LCA":{"n":"Saint Lucia","cap":"Castries","area":"~616 km²","pop":"~0.18 million","lang":"English (official); Kwéyòl (Saint Lucian Creole)","cur":"Eastern Caribbean dollar (XCD, pegged 2.7:1 to the US dollar)","gov":"Parliamentary constitutional monarchy (King Charles III)","ind":"22 Feb 1979, from the UK; the island changed hands between France and Britain about 14 times.","geo":"A volcanic island dominated by the twin Pitons (UNESCO), with Mount Gimie (950 m), rainforest, the Sulphur Springs geothermal area and banana plantations on the slopes.","eco":"Tourism, bananas (declining), offshore services and a citizenship-by-investment program. The island is exposed to hurricanes.","eth":"About 85% of African descent, ~10% mixed and ~2% Indo-Saint Lucian, with a small European minority. Saint Lucia has produced two Nobel laureates, Arthur Lewis (economics, 1979) and Derek Walcott (literature, 1992).","cul":"Jounen Kwéyòl (Creole Day), the Saint Lucia Jazz Festival and the flower societies La Rose and La Marguerite. Food: green fig and saltfish (national dish), bouyon and bakes. Mostly Catholic (~60%). Cricket is popular, and Daren Sammy captained the West Indies to two T20 titles.","pm":0.18,"ak":616},"GRD":{"n":"Grenada","cap":"St. George’s","area":"~344 km² (including Carriacou and Petite Martinique)","pop":"~0.12 million","lang":"English (official); Grenadian Creole English and French Patois","cur":"Eastern Caribbean dollar (XCD)","gov":"Parliamentary constitutional monarchy (King Charles III)","ind":"7 Feb 1974, from the UK. A 1979 revolution and a 1983 coup preceded a US-led invasion in October 1983.","geo":"A volcanic island with Grand Etang Lake, rainforest and Mount Saint Catherine (840 m), plus the smaller islands of Carriacou and Petite Martinique. The Molinere Underwater Sculpture Park draws divers. Hurricane Ivan devastated the island in 2004.","eco":"Tourism, spices (nutmeg and mace earned it the name Isle of Spice), cocoa, medical education at St George’s University and a citizenship-by-investment program.","eth":"About 82% of African descent, ~13% mixed and ~2% Indo-Grenadian, with a small European minority and Indigenous Carib and Arawak heritage.","cul":"Spicemas Carnival, the Carriacou Regatta and the Big Drum nation dances. Food: oil down (national dish), nutmeg ice cream and local rum. Catholic majority with Anglicans. Cricket is popular, and Kirani James won Olympic 400 m gold in 2012.","pm":0.12,"ak":344},"VCT":{"n":"Saint Vincent and the Grenadines","cap":"Kingstown","area":"~389 km² (Saint Vincent plus the northern Grenadines)","pop":"~0.11 million","lang":"English (official); Vincentian Creole","cur":"Eastern Caribbean dollar (XCD)","gov":"Parliamentary constitutional monarchy (King Charles III)","ind":"27 Oct 1979, from the UK. In 1797 the British deported Garifuna (Black Caribs) from Saint Vincent to Roatán, which seeded Garifuna communities across Central America.","geo":"A volcanic main island with La Soufrière (1,234 m), which erupted explosively in April 2021, and coral Grenadines such as Bequia, Mustique and Canouan, with the Tobago Cays marine park.","eco":"Tourism, agriculture (bananas and arrowroot) and small offshore finance. Hurricanes and volcanic risk are constant concerns.","eth":"About 66% of African descent, ~19% mixed, ~6% Indo-Vincentian and ~2% Indigenous (Carib and Garifuna descendants), plus a small Portuguese community from Madeira.","cul":"Vincy Mas Carnival in late June and July, and the Nine Mornings festival before Christmas. Food: roasted breadfruit with fried jackfish (national dish). Anglican, Methodist and Catholic. Cricket is popular, and parts of Pirates of the Caribbean were filmed here.","pm":0.11,"ak":389},"ATG":{"n":"Antigua and Barbuda","cap":"St. John’s","area":"~442 km² (Antigua, Barbuda and uninhabited Redonda)","pop":"~0.1 million","lang":"English (official); Antiguan Creole","cur":"Eastern Caribbean dollar (XCD)","gov":"Parliamentary constitutional monarchy (King Charles III)","ind":"1 Nov 1981, from the UK. Nelson’s Dockyard in English Harbour (UNESCO) was a Royal Navy base.","geo":"Low limestone and coral islands with many beaches and reef-lined bays; Boggy Peak (402 m) is the high point. Barbuda is flat, with pink-sand beaches and a large frigate bird sanctuary, and Hurricane Irma devastated it in 2017.","eco":"Tourism provides the bulk of GDP, alongside offshore services and a citizenship-by-investment program, giving it one of the higher incomes in the Eastern Caribbean.","eth":"About 90% of African descent and ~4% mixed, with small European, Lebanese and Syrian communities. Barbudans hold land communally under the Barbuda Land Act.","cul":"Antigua Carnival, Sailing Week in April, steel band and calypso. Food: ducana and saltfish (national dish), fungee and pepperpot. Mostly Anglican. Cricket legends include Viv Richards and Andy Roberts.","pm":0.1,"ak":442},"DMA":{"n":"Dominica","cap":"Roseau","area":"~751 km²","pop":"~0.07 million","lang":"English (official); Kwéyòl (Dominican Creole) and Kokoy","cur":"Eastern Caribbean dollar (XCD)","gov":"Parliamentary republic (a president is head of state)","ind":"3 Nov 1978, from the UK. It is home to the Caribbean’s largest remaining Kalinago (Carib) population.","geo":"The Nature Island: rugged, volcanic and rainforest-covered, with Morne Trois Pitons National Park (UNESCO), the Boiling Lake, hot springs and Morne Diablotins (1,447 m). Sperm whales live offshore, and Hurricane Maria devastated the island in 2017. Not to be confused with the Dominican Republic.","eco":"Agriculture (bananas and root crops), ecotourism, a citizenship-by-investment program and offshore services. The economy is still recovering from Maria, and geothermal power is planned.","eth":"About 87% of African descent, ~9% mixed and ~3% Kalinago, who live in the Kalinago Territory on the east coast, with small European and Syrian-Lebanese communities.","cul":"Creole Day (Jounen Kwéyòl), the World Creole Music Festival and Mas Domnik Carnival, with Kalinago basket weaving. Food: callaloo soup and breadfruit. Catholic majority. The author Jean Rhys (Wide Sargasso Sea) was born in Roseau.","pm":0.07,"ak":751},"KNA":{"n":"Saint Kitts and Nevis","cap":"Basseterre","area":"~261 km²","pop":"~0.05 million (the smallest country in the Americas by both population and area)","lang":"English (official); Kittitian and Nevisian Creole","cur":"Eastern Caribbean dollar (XCD)","gov":"Federal parliamentary constitutional monarchy (King Charles III)","ind":"19 Sept 1983, from the UK. Nevis has a constitutional right to secede, and a 1998 referendum fell short of the required two-thirds.","geo":"Two volcanic islands separated by a narrow channel: Mount Liamuiga (1,156 m) on Saint Kitts and Nevis Peak (985 m). Brimstone Hill Fortress is a UNESCO site, and a scenic railway follows the old sugar line.","eco":"Tourism and citizenship-by-investment (the oldest such program, from 1984) dominate, with offshore finance and light manufacturing. The sugar industry closed in 2005.","eth":"About 92% of African descent and ~3% mixed, with small European, East Indian and Lebanese communities. Alexander Hamilton was born on Nevis.","cul":"Sugar Mas Carnival in December, Culturama on Nevis, and masquerade and stilt-walking Moko Jumbies. Food: goat water (national dish) and saltfish. Mostly Anglican and Methodist. Cricket is popular.","pm":0.05,"ak":261},"CYM":{"n":"Cayman Islands","cap":"George Town (on Grand Cayman)","area":"~264 km² (Grand Cayman, Cayman Brac and Little Cayman)","pop":"~0.08 million","lang":"English; Jamaican Patois, Spanish and Filipino languages among residents","cur":"Cayman Islands dollar (KYD, pegged 1.2:1 to the US dollar)","gov":"British Overseas Territory (a governor appointed by the Crown and an elected premier)","ind":"Not independent: British since the 1670 Treaty of Madrid and administered from Jamaica until 1962.","geo":"Three low coral islands south of Cuba. Grand Cayman has Seven Mile Beach and Stingray City, Cayman Brac rises to The Bluff (43 m), and Little Cayman is known for diving. Hurricanes are the main hazard.","eco":"A global offshore financial center with no direct taxes on income, plus tourism, giving it one of the highest incomes in the Caribbean. Most workers are expatriates.","eth":"Roughly 40% of residents are native-born Caymanians, mostly of mixed African and European descent. The rest come from Jamaica, the Philippines, the UK, the US, Canada, India and elsewhere.","cul":"Pirates Week in November, catboats, and a turtle-eating heritage now tied to conservation (the Cayman Turtle Centre). Food: cassava cake, fish rundown and conch. Mostly Protestant (Presbyterian, Anglican, Baptist). Cricket and football are popular.","pm":0.08,"ak":264},"TCA":{"n":"Turks and Caicos Islands","cap":"Cockburn Town (on Grand Turk)","area":"~948 km² (about 40 islands, 8 inhabited)","pop":"~0.05 million","lang":"English; Haitian Creole and Spanish among migrants","cur":"US dollar (USD)","gov":"British Overseas Territory (a governor appointed by the Crown and an elected premier)","ind":"Not independent: British since the 1700s and a Jamaican dependency until 1962.","geo":"Flat limestone islands southeast of the Bahamas, with Grace Bay on Providenciales, one of the Caribbean’s best-known beaches, and the world’s third-largest barrier reef system. Some historians place Columbus’s first landfall at Grand Turk.","eco":"Tourism and luxury resorts, offshore financial services, and lobster and conch fishing. Prices and incomes are high for the region.","eth":"“Belongers” of mainly African descent are a minority of residents, alongside large Haitian, Dominican, Jamaican, Filipino and North American communities.","cul":"Ripsaw (rake-and-scrape) music, Junkanoo, and conch in every form. Mostly Baptist, Anglican and Methodist. Sailing and boat building on traditional sloops are valued traditions.","pm":0.05,"ak":948},"AIA":{"n":"Anguilla","cap":"The Valley","area":"~91 km²","pop":"~0.016 million","lang":"English; Anguillian Creole","cur":"Eastern Caribbean dollar (XCD)","gov":"British Overseas Territory (a governor appointed by the Crown and an elected chief minister)","ind":"Not independent: British since 1650. A 1967 revolt against rule from St Kitts led to separate status, confirmed in 1980.","geo":"A flat, eel-shaped coral island with more than 30 white-sand beaches such as Shoal Bay and Meads Bay, and offshore cays. Hurricane Irma damaged it in 2017.","eco":"Luxury tourism, offshore services and lobster fishing. The territory also earns revenue from its .ai internet domain, which has boomed with artificial intelligence.","eth":"About 85% of African descent, with small European, Latin American and Indian communities.","cul":"Boat racing on traditional wooden sloops is the national sport, and the summer festival (Carnival) draws crowds in August. Food: grilled crayfish and spiny lobster. Mostly Anglican and Methodist.","pm":0.016,"ak":91},"VGB":{"n":"British Virgin Islands","cap":"Road Town (on Tortola)","area":"~151 km² (about 60 islands)","pop":"~0.03 million","lang":"English","cur":"US dollar (USD)","gov":"British Overseas Territory (a governor appointed by the Crown and an elected premier)","ind":"Not independent: British since 1672. Slavery ended in
