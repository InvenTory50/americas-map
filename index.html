 1834.","geo":"Hilly volcanic Tortola, Virgin Gorda with its granite boulders at The Baths, Jost Van Dyke, and low-lying coral Anegada, ringed by one of the Caribbean’s largest barrier reefs. A premier sailing area. Hurricane Irma caused severe damage in 2017.","eco":"Offshore company registration (hundreds of thousands of companies) and tourism, especially yacht charters. One of the Caribbean’s richest economies per person.","eth":"About three-quarters of African descent, with sizable communities from other Caribbean islands, the US, UK and Latin America.","cul":"Fungi (scratch band) music and the August Emancipation Festival. Food: Anegada lobster, fish and fungi, and roti. Mostly Methodist and Anglican. Sailing regattas are major events.","pm":0.03,"ak":151},"VIR":{"n":"US Virgin Islands","cap":"Charlotte Amalie (on St. Thomas)","area":"~346 km² (St. Thomas, St. John and St. Croix)","pop":"~0.09 million","lang":"English; Virgin Islands Creole and Spanish","cur":"US dollar (USD)","gov":"Unincorporated territory of the United States; residents are US citizens but cannot vote in presidential elections and have a non-voting delegate in Congress","ind":"Not independent: purchased by the US from Denmark in 1917 for $25 million in gold.","geo":"Three main islands. St. Thomas has a busy harbor, St. John is more than half national park (Virgin Islands National Park), and St. Croix is larger and flatter. Hurricanes Irma and Maria hit in 2017.","eco":"Tourism, including cruise ships, is the main earner, with rum (Cruzan) and federal transfers. The big HOVENSA refinery on St. Croix closed in 2012.","eth":"About three-quarters Black or African American, with growing Latino, white and Indian communities and many migrants from other islands.","cul":"Carnival on St. Thomas each April–May, Crucian Christmas Festival on St. Croix, and quelbe, the official folk music. Danish colonial architecture and place names remain. Mostly Protestant and Catholic.","pm":0.09,"ak":346},"MSR":{"n":"Montserrat","cap":"Plymouth (abandoned); Brades is the administrative center","area":"~102 km²","pop":"~0.004 million","lang":"English","cur":"Eastern Caribbean dollar (XCD)","gov":"British Overseas Territory (a governor appointed by the Crown and an elected premier)","ind":"Not independent: British since 1632, settled by Irish colonists.","geo":"A volcanic island where the Soufrière Hills volcano erupted from 1995, burying the capital Plymouth and killing 19 people. The south is an exclusion zone, and activity continues. Known as the Emerald Isle of the Caribbean for its Irish heritage and green hills.","eco":"Aid-dependent, with small tourism, construction and a tiny population, since about two-thirds of residents left after the eruption.","eth":"Mostly of African descent, with some Irish ancestry and a small expatriate community.","cul":"St Patrick’s Day is a public holiday that also marks a 1768 slave uprising. Irish traditions appear in names and food, such as goat water. Mostly Anglican, Methodist and Catholic. George Martin’s AIR Studios hosted famous recordings here in the 1980s.","pm":0.004,"ak":102},"GLP":{"n":"Guadeloupe","cap":"Basse-Terre (largest city: Les Abymes; business hub: Pointe-à-Pitre)","area":"~1,628 km²","pop":"~0.38 million","lang":"French (official); Guadeloupean Creole","cur":"Euro (EUR)","gov":"Overseas department and region of France; part of the EU","ind":"Not independent: French since 1635 and an overseas department since 1946.","geo":"A butterfly-shaped archipelago. Basse-Terre is volcanic and mountainous, with La Soufrière (1,467 m) and a national park, and Grande-Terre is flat with beaches. Marie-Galante, Les Saintes and La Désirade lie nearby.","eco":"Tourism, bananas, sugar cane and rum, supported by French public spending. Unemployment and prices are high, and protests in 2021 and 2009 reflected the cost of living and the pandemic.","eth":"Majority of African descent, with large Indo-Guadeloupean (Tamil) and Syrian-Lebanese communities and a French metropolitan minority.","cul":"Gwo ka drumming (UNESCO), Carnival, and Creole food: colombo, accras and boudin créole. Mostly Catholic, with Hindu traditions among Indo-Guadeloupeans. Zouk music took off with the group Kassav’.","pm":0.38,"ak":1628},"MTQ":{"n":"Martinique","cap":"Fort-de-France","area":"~1,128 km²","pop":"~0.36 million","lang":"French (official); Martinican Creole","cur":"Euro (EUR)","gov":"Overseas department and single territorial collectivity of France; part of the EU","ind":"Not independent: French since 1635 and an overseas department since 1946.","geo":"A volcanic island with Mont Pelée (1,397 m), whose 1902 eruption destroyed the city of Saint-Pierre and killed roughly 28,000 people, plus rainforest in the north and beaches in the south.","eco":"Tourism, bananas, rum (with a protected appellation) and French public spending. Pollution of farmland by the banana pesticide chlordecone is a long-running public-health issue.","eth":"Majority of African descent, with an Indo-Martinican community and the Békés, white descendants of planters who still hold much economic power.","cul":"Home of Négritude thinkers Aimé Césaire and Frantz Fanon, and writer Édouard Glissant. Empress Joséphine was born here. Vaval Carnival, zouk and biguine music, and Creole food. Mostly Catholic.","pm":0.36,"ak":1128},"ABW":{"n":"Aruba","cap":"Oranjestad","area":"~180 km²","pop":"~0.11 million","lang":"Papiamento and Dutch (official); English and Spanish widely spoken","cur":"Aruban florin (AWG, pegged 1.79 per US dollar)","gov":"Constituent country of the Kingdom of the Netherlands, with its own parliament and prime minister","ind":"Not independent: Dutch since 1636, and a separate constituent country since 1986.","geo":"A dry, flat island of cacti, divi-divi trees and white-sand beaches such as Eagle Beach, lying just outside the hurricane belt off Venezuela.","eco":"Tourism provides most of the economy, with a heavy reliance on visitors from the US. The island’s oil refinery has closed.","eth":"Mixed Indigenous (Caquetío), European and African ancestry, with large Colombian, Venezuelan, Dutch, Dominican and other communities.","cul":"Papiamento language, Carnival with its Lighting Parade, Dera Gai (St John’s Day, 24 June), and dande music. Food: keshi yena (stuffed cheese) and pastechi. Mostly Catholic.","pm":0.11,"ak":180},"CUW":{"n":"Curaçao","cap":"Willemstad","area":"~444 km²","pop":"~0.15 million","lang":"Papiamentu and Dutch (official); English widely spoken","cur":"Caribbean guilder (XCG, replaced the Netherlands Antilles guilder in 2025)","gov":"Constituent country of the Kingdom of the Netherlands, with its own parliament and prime minister","ind":"Not independent: Dutch since 1634, and a constituent country since 2010 when the Netherlands Antilles dissolved.","geo":"A dry island with a colorful Dutch-colonial waterfront and the floating Queen Emma Bridge in Willemstad (UNESCO), plus coves and reefs, lying south of the hurricane belt.","eco":"Tourism, shipping and a dry dock, financial services, and the Isla oil refinery, which has been idle. Blue Curaçao liqueur is a famous export.","eth":"Mostly of African descent, with Dutch, Venezuelan, Colombian, Dominican and long-established Sephardic Jewish communities.","cul":"Tumba festival and Carnival, Seú harvest festival, and the Mikvé Israel-Emanuel synagogue (1732), the oldest in the Americas still in use. Mostly Catholic. Baseball stars include Andruw Jones and Kenley Jansen.","pm":0.15,"ak":444},"SXM":{"n":"Sint Maarten","cap":"Philipsburg","area":"~34 km² (the Dutch southern half of the island of Saint Martin)","pop":"~0.04 million","lang":"English (main language), Dutch (official), Papiamento and Spanish","cur":"Caribbean guilder (XCG, replaced the Netherlands Antilles guilder in 2025)","gov":"Constituent country of the Kingdom of the Netherlands, with its own parliament and prime minister","ind":"Not independent: Dutch since 1648, and a constituent country since 2010. The island is shared with French Saint-Martin, which is a separate territory, in the world’s smallest island divided between two countries.","geo":"A hilly island with beaches and lagoons. Planes land low over Maho Beach at Princess Juliana airport. Hurricane Irma damaged most buildings in 2017.","eco":"Tourism, duty-free shopping and cruise ships make up most of the economy. Reconstruction after Irma has been slow.","eth":"Highly diverse, with residents from over 100 nationalities, including Afro-Caribbean, Dominican, Haitian, Jamaican and Dutch communities.","cul":"Carnival in spring, the Heineken Regatta, and guavaberry liqueur as the national drink. Food: johnny cakes and Creole dishes. Mostly Protestant, Catholic and Methodist.","pm":0.04,"ak":34},"MAF":{"n":"Saint-Martin","cap":"Marigot","area":"~53 km² (the northern part of the island of Saint Martin, which totals 87 km²)","pop":"~0.03 million","lang":"French (official); English, Saint Martin Creole and Spanish","cur":"Euro (EUR)","gov":"Overseas collectivity of France; an outermost region of the EU","ind":"Not independent: French since 1648, when the Treaty of Concordia split the island with the Dutch. It separated from Guadeloupe and became its own collectivity in 2007.","geo":"The French northern part of the island, with Marigot, Grand Case and Orient Bay, hills topped by Pic Paradis (424 m), and a lagoon shared with Sint Maarten. Hurricane Irma devastated it in 2017, and the open border with Sint Maarten has no checkpoints.","eco":"Tourism, duty-free shopping and restaurants (Grand Case is known for its dining) make up most of the economy, with reconstruction after Irma and French public funding.","eth":"Diverse: an Afro-Caribbean majority, mainland French, Haitian, Dominican, Dutch and Lebanese communities, and many residents born elsewhere.","cul":"Carnival before Lent, Concordia Day on 11 November, and Creole cuisine at the roadside grills (lolos) of Grand Case. The shared island is called Soualiga by many locals. Mostly Catholic and Protestant.","pm":0.03,"ak":53},"BLM":{"n":"Saint-Barthélemy","cap":"Gustavia","area":"~25 km²","pop":"~0.01 million","lang":"French (official); English widely spoken","cur":"Euro (EUR)","gov":"Overseas collectivity of France, outside the EU since 2012","ind":"Not independent: French since 1648, but given to Sweden in 1784 and bought back by France in 1878. It separated from Guadeloupe and became its own collectivity in 2007.","geo":"A small, dry, hilly island with about 20 beaches (Saline, Gouverneur) and a sheltered harbor at Gustavia, named after Sweden’s King Gustav III. Hurricane Irma damaged it in 2017.","eco":"Luxury tourism, villas and yachting give it some of the highest incomes and property prices in the Caribbean. It is a duty-free port with generous tax rules.","eth":"Mostly descendants of Breton and Norman settlers, plus expatriates and a workforce from Portugal and elsewhere, and a smaller Afro-Caribbean community.","cul":"Swedish street names and heritage, the Bucket Regatta and a famous New Year’s Eve. French cuisine and French-Caribbean dishes. Mostly Catholic. A favorite destination of celebrities.","pm":0.01,"ak":25},"BON":{"n":"Bonaire","cap":"Kralendijk","area":"~288 km²","pop":"~0.025 million","lang":"Dutch (official); Papiamentu, English and Spanish","cur":"US dollar (USD)","gov":"Special municipality of the Netherlands (part of the Caribbean Netherlands)","ind":"Not independent: Dutch since 1636, and a special municipality of the Netherlands since 2010.","geo":"A dry island south of the hurricane belt, famed for shore diving and its marine park (protected since 1979). The Pekelmeer salt pans shelter a large flamingo colony, and the island has centuries-old salt works.","eco":"Diving and eco-tourism, salt production and small services, supported by Dutch funding. Living costs are high.","eth":"Mostly of mixed African and European descent, with Dutch, Colombian, Venezuelan, Dominican and Surinamese residents.","cul":"Papiamentu language, the Simadan harvest festival, Carnival and Rincon Day. Food: keshi yena and kabritu (goat stew). Mostly Catholic. Windsurfing and flamingo watching are popular.","pm":0.025,"ak":288},"SAB":{"n":"Saba","cap":"The Bottom","area":"~13 km²","pop":"~0.002 million","lang":"Dutch (official); English is the main language","cur":"US dollar (USD)","gov":"Special municipality of the Netherlands (part of the Caribbean Netherlands)","ind":"Not independent: Dutch since 1640, and a special municipality since 2010.","geo":"A tiny volcanic island that is essentially one peak, Mount Scenery (887 m), the highest point in the Kingdom of the Netherlands. It has no beaches, a famously short runway, a winding road built by residents, and a marine park. Known as the Unspoiled Queen.","eco":"Tourism (diving and hiking) and a medical school are the mainstays, with Dutch support.","eth":"Descendants of Dutch, Scottish, English and African settlers, plus expatriate Dutch and North American residents.","cul":"Saba lace (a Spanish-work craft), Saba Day in December, and the Summer Festival. English-speaking Protestant and Catholic traditions in villages like Windwardside.","pm":0.002,"ak":13},"STA":{"n":"Sint Eustatius","cap":"Oranjestad","area":"~21 km²","pop":"~0.003 million","lang":"Dutch (official); English is the main language","cur":"US dollar (USD)","gov":"Special municipality of the Netherlands (part of the Caribbean Netherlands)","ind":"Not independent: Dutch since 1636, and a special municipality since 2010. In 1776 Fort Oranje fired the first foreign salute to the US flag, and the British sacked the island in 1781.","geo":"A volcanic island dominated by The Quill (601 m), a dormant volcano with a rainforest in its crater. In the 1700s the Golden Rock was one of the Caribbean’s busiest trading ports, and sunken ships and ruins draw archaeologists and divers.","eco":"An oil transshipment terminal is the largest employer, with tourism and archaeology, and heavy reliance on Dutch funding.","eth":"Mostly of African descent, with Dutch, Dominican, Venezuelan and North American residents.","cul":"Statia-America Day on 16 November, Carnival, and the ruins of the Honen Dalim synagogue (1739) and Fort Oranje. Methodist, Catholic and Adventist congregations.","pm":0.003,"ak":21}},R={"sa":["ARG","BOL","BRA","CHL","COL","ECU","GUY","PRY","PER","SUR","URY","VEN","GUF"],"ca":["BLZ","GTM","HND","SLV","NIC","CRI","PAN"],"na":["MEX","CUB","DOM","HTI","JAM","BHS","TTO","BRB","LCA","GRD","VCT","ATG","DMA","KNA"],"ter":["PRI","CYM","TCA","AIA","VGB","VIR","MSR","GLP","MTQ","ABW","CUW","SXM","MAF","BLM","BON","SAB","STA"]},V={"all":"-4 -9 518 594","na":"0 -5 364 159","ter":"204 53 158 98","ca":"151 88 98 81","sa":"211 122 302 462"},M={"BRB":[353.4,127.5],"LCA":[344.7,122.8],"GRD":[340.5,134.5],"VCT":[343.4,127.1],"ATG":[339.7,102.3],"DMA":[342.4,113.0],"KNA":[333.8,100.4],"CYM":[222.2,87.6],"TCA":[279.3,71.8],"AIA":[331.4,93.1],"VGB":[323.1,92.6],"VIR":[320.7,95.5],"MSR":[337.4,104.4],"GLP":[341.2,107.6],"MTQ":[344.4,118.0],"ABW":[290.3,131.8],"CUW":[296.3,134.1],"SXM":[333.1,97.2],"MAF":[331.0,95.2],"BLM":[335.2,98.1],"BON":[300.6,134.1],"SAB":[330.7,98.5],"STA":[332.2,100.7]};
const svg=document.getElementById('m'),panel=document.getElementById('p'),dark=matchMedia('(prefers-color-scheme: dark)').matches,cb=document.getElementById('cmp'),q=document.getElementById('q');let cmp=false,sk='pm',sd=-1,cur='COL';
